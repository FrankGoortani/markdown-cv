<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSE Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      padding: 8px 16px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #0063b1;
    }
    #result {
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 4px;
      white-space: pre-wrap;
      margin-top: 20px;
      min-height: 100px;
    }
    .log {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 10px;
    }
    .error { color: red; }
    .success { color: green; }
    .info { color: blue; }
  </style>
</head>
<body>
  <h1>SSE Connection Test</h1>
  <p>This page tests the Server-Sent Events (SSE) connection to your Cloudflare Worker.</p>

  <div>
    <button onclick="testSSE('profile')">Get Profile</button>
    <button onclick="testSSE('skills')">Get Skills</button>
    <button onclick="testSSE('interests')">Get Interests</button>
    <button onclick="testSSE('search?q=JavaScript')">Search for JavaScript</button>
    <button onclick="testSSE('company?name=Uber')">Get Uber Experience</button>
  </div>

  <h2>Response:</h2>
  <div id="result">Click a button above to test the SSE connection.</div>

  <div class="log" id="log"></div>

  <script>
    const logElement = document.getElementById('log');
    const resultElement = document.getElementById('result');

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logElement.prepend(entry);
      console.log(`[${type}]`, message);
    }

    function testSSE(endpoint) {
      resultElement.textContent = 'Connecting...';
      log(`Testing endpoint: ${endpoint}`, 'info');

      // Clear previous log entries
      while (logElement.firstChild) {
        logElement.removeChild(logElement.firstChild);
      }

      try {
        const url = `https://frank-cv-sse.frank-b2a.workers.dev/sse/${endpoint}`;
        log(`Connecting to: ${url}`, 'info');

        const eventSource = new EventSource(url);

        eventSource.onopen = (event) => {
          log('Connection opened', 'success');
        };

        eventSource.onmessage = (event) => {
          log(`Received message: ${event.data}`, 'success');

          try {
            if (event.data.includes('[DONE]')) {
              log('Received DONE signal, closing connection', 'info');
              eventSource.close();
              return;
            }

            const data = JSON.parse(event.data);
            resultElement.textContent = data.text;
          } catch (error) {
            log(`Error parsing message: ${error.message}`, 'error');
          }
        };

        eventSource.onerror = (error) => {
          log(`Connection error: ${error.type}`, 'error');
          resultElement.textContent = 'Connection error. Check console for details.';
          eventSource.close();
        };

      } catch (error) {
        log(`Failed to create EventSource: ${error.message}`, 'error');
        resultElement.textContent = 'Failed to establish connection. Check console for details.';
      }
    }
  </script>
</body>
</html>
