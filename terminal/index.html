<body>
  <a href="#cmd" class="skip-link">Skip to command input</a>
  <div class="screen">
    <div class="term" role="region" aria-label="terminal">
      <div class="header">
        <div class="brand">GOORTANI::CV</div>
        <div class="nav-inline">
          <a href="../" title="Professional profile">Professional</a>
          <a href="../magazine/" title="PC Magazine style profile">PC&nbsp;Magazine</a>
          <a href="../short/" title="Short CV">Short</a>
          <a href="https://medium.com/@FrankGoortani" title="Blog">Blog</a>
          <a href="mailto:frank@goortani.com" title="Email Frank">Email</a>
          <a href="../resume/" target="_blank" rel="noopener" title="Main Resume">Main&nbsp;Resume</a>
        </div>
      </div>

      <div id="out" class="output" aria-live="polite"></div>

      <div class="mobile-commands">
        <button class="cmd-btn" data-command="help">Help</button>
        <button class="cmd-btn" data-command="cv">Full CV</button>
        <button class="cmd-btn" data-command="short">Short CV</button>
        <button class="cmd-btn" data-command="fasteroutcomes">FasterOutcomes</button>
        <button class="cmd-btn" data-command="contact">Contact</button>
        <button class="cmd-btn" data-command="links">Links</button>
      </div>

      <div class="prompt" aria-label="command prompt">
        <span class="prompt-label">$</span>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus placeholder="type a command (try: help, cv, short, links)">
        <span class="cursor" aria-hidden="true"></span>
      </div>

      <div class="footer">
        <span>Tip: Press <kbd>Enter</kbd> to run commands. <em>Accessible and reduced-motion friendly.</em></span>
      </div>
    </div>
  </div>
