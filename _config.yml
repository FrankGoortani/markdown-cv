# GitHub Pages configuration for Frank Goortani's personal profile site
# This ensures proper handling of assets and paths

# Site settings
title: "Frank Goortani | CTO at FasterOutcomes"
description: "AI engineering executive, CTO, and production LLM systems leader."
baseurl: "" # Leave empty for GitHub Pages user/organization sites
url: "" # Will be set automatically by GitHub Pages

# Build settings
markdown: kramdown
highlighter: rouge
timezone: America/Toronto

# Jekyll plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Exclude files from processing
exclude:
  - node_modules/
  - package.json
  - package-lock.json
  - tools/
  # Printable resume sources are local PDF inputs, not public profile pages.
  - resume-cto/resume.html
  - resume-master/resume.html
  - BACKUP_OLD_RESUMES/
  # Retired public PDF URLs: keep originals locally until career facts are reconciled.
  - media/frank-goortani-cto-executive_2026.pdf
  - media/frank-goortani-master-resume_2026.pdf
  - media/frank-goortani-profile-magazine.pdf
  - README.md
  - .gitignore

# Include files that would normally be excluded
include:
  - _config.yml

# Sass/SCSS settings
sass:
  sass_dir: .
  style: compressed

# Collections and defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# GitHub Pages specific settings
github: [metadata]
